<!doctype html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0A0D12"><meta name="razao-version" content="2026-08-25-v15.1-reference"><link rel="manifest" href="./manifest.json"><link rel="icon" href="./icon-v14.png"><title>Razão — Renda Fixa</title><style>
  * { box-sizing: border-box; }
  html { background:#0A0D12; }
  body {
    margin: 0;
    background:#0A0D12;
    padding-top: env(safe-area-inset-top);
    padding-bottom: env(safe-area-inset-bottom);
    min-height: 100dvh;
  }
  #root { min-height: calc(100dvh - env(safe-area-inset-top) - env(safe-area-inset-bottom)); }
  @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
  .scrollbar-thin::-webkit-scrollbar { height: 6px; width: 6px; }
  .scrollbar-thin::-webkit-scrollbar-thumb { background: #1C232E; border-radius: 4px; }
  table { font-variant-numeric: tabular-nums; }
  tbody tr:hover { background: #1C232E; }
  input[type=date] { color-scheme: dark; } select { color-scheme: dark; }
  input::placeholder, textarea::placeholder { color: #6B7480; opacity: .8; }

.header-icon{width:38px;height:38px;border-radius:12px;border:1px solid var(--line);background:#111c29;color:#e8eef6;display:grid;place-items:center;font-size:18px;flex:none}.topbar{display:grid;grid-template-columns:42px 1fr 42px;align-items:center}.brand{justify-self:center}.head-actions{justify-self:end}.head-actions .primary-btn{display:flex}.reference-stat-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.reference-stat-grid>div{min-height:76px}.investment-hit{display:block;width:100%;background:none;border:0;color:inherit;text-align:left;padding:0;cursor:pointer}.investment-hit:focus{outline:2px solid rgba(91,157,240,.45);outline-offset:4px;border-radius:12px}.detail-hero{display:flex;justify-content:space-between;align-items:center;gap:14px}.detail-hero h1{font-size:20px;margin:6px 0 3px}.detail-hero p{font-size:10px;color:var(--muted);margin:0}.detail-metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:9px}.detail-metrics .ref-card{padding:13px}.detail-metrics span{display:block;color:var(--muted);font-size:9px;text-transform:uppercase;font-weight:800}.detail-metrics strong{display:block;font-family:"IBM Plex Mono",monospace;font-size:16px;margin-top:6px}.settings-card{padding:0;overflow:hidden}.settings-title{padding:16px 16px 8px;font-size:15px;font-weight:850}.settings-row{width:100%;display:flex;align-items:center;justify-content:space-between;gap:15px;text-align:left;border:0;border-top:1px solid var(--line);background:transparent;color:var(--text);padding:14px 16px}.settings-row b{display:block;font-size:12px}.settings-row small{display:block;color:var(--muted);font-size:9.5px;margin-top:3px}.settings-row>span:last-child{color:var(--muted);font-size:11px;white-space:nowrap}.settings-divider{height:10px;background:#0b1724;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}.safe-card{display:flex;gap:12px;padding:18px 16px;align-items:flex-start}.safe-check{width:34px;height:34px;border-radius:50%;background:#173b2d;color:#32D583;display:grid;place-items:center;font-weight:900;flex:none}.safe-card b{font-size:13px}.safe-card p{font-size:10px;line-height:1.45;color:var(--muted);margin:5px 0 0}@media(max-width:700px){.reference-stat-grid{grid-template-columns:1fr 1fr}.detail-metrics{grid-template-columns:1fr 1fr}.brand-name{font-size:18px}.topbar{padding-left:10px;padding-right:10px}.head-actions .primary-btn{padding:9px 11px}.head-actions .primary-btn svg{display:none}}
</style></head><body><div id="root"></div><script>
(function(){
 const cdns={React:['https://unpkg.com/react@18.3.1/umd/react.production.min.js','https://cdn.jsdelivr.net/npm/react@18.3.1/umd/react.production.min.js','https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js'],ReactDOM:['https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js','https://cdn.jsdelivr.net/npm/react-dom@18.3.1/umd/react-dom.production.min.js','https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js']};
 function load(url){return new Promise((resolve,reject)=>{const s=document.createElement('script');s.src=url;s.onload=resolve;s.onerror=reject;document.head.appendChild(s)})}
 async function any(list,globalName){if(window[globalName])return;let last;for(const u of list){try{await load(u);if(window[globalName])return}catch(e){last=e}}throw last||new Error('Biblioteca '+globalName+' indisponível')}
 async function boot(){try{await any(cdns.React,'React');await any(cdns.ReactDOM,'ReactDOM');const s=document.createElement('script');s.src='./app.js';s.onload=()=>{};s.onerror=()=>showError('Não foi possível carregar o código do aplicativo.');document.body.appendChild(s)}catch(e){showError('O aplicativo não conseguiu carregar as bibliotecas necessárias. Verifique sua conexão e recarregue a página.')}}
 function showError(msg){document.getElementById('root').innerHTML='<div style="min-height:100dvh;display:grid;place-items:center;padding:28px;background:#0A0D12;color:#EDEFF3;font:15px system-ui;text-align:center"><div><b>Razão não conseguiu iniciar</b><p style="color:#98A2AF;line-height:1.5">'+msg+'</p></div></div>'}
 boot();
})();
</script></body></html>
