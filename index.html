function bcbDateToISO(d) { const [dd, mm, yyyy] = d.split('/'); return `${yyyy}-${mm}-${dd}`; }

function diasUteisEntre(d1, d2) {

function parametroLabel(indexador) {

}

  if (inv.indexador === 'SELIC') return `${p}% da Selic (≈ ${fmtPct(efetiva)} a.a.)`;

function calcMetrics(inv, today, ref) {

  hist.forEach(h => { if (h.data <= today) { ancoraData = h.data; ancoraValor = h.valorBruto; } });
  const diasDesdeAncora = Math.max(diffDays(ancoraData, today), 0);

  } else if (!usaOverride && inv.indexador === 'SELIC' && ref.historicoSelic && ref.historicoSelic.length) {
    valorAtualBruto = ancoraValor * fatorAcumulado(ref.historicoSelic, ancoraData, today, (Number(inv.parametroValor) || 0) / 100);
    precisao = 'historico';

  const iofAliq = diasCorridos < 30 ? aliquotaIOFPorDias(diasCorridos) : 0;
  const iofValor = ganhoBruto > 0 ? ganhoBruto * (iofAliq / 100) : 0;
  const ganhoAposIOF = ganhoBruto - iofValor;
  const aliqIR = inv.isentoIR ? 0 : (inv.aliquotaIRManual !== '' && inv.aliquotaIRManual != null ? Number(inv.aliquotaIRManual) : aliquotaIRPorDias(diasCorridos));
  const irValor = ganhoAposIOF > 0 ? ganhoAposIOF * (aliqIR / 100) : 0;
  const valorAtualLiquido = valorAtualBruto - iofValor - irValor;

  const rentBrutaTotal = (valorAtualBruto / inv.valorAplicado - 1) * 100;
  const rentLiquidaTotal = (valorAtualLiquido / inv.valorAplicado - 1) * 100;
  const rentBrutaMensal = diasCorridos > 0 ? (Math.pow(valorAtualBruto / inv.valorAplicado, 30 / diasCorridos) - 1) * 100 : null;
  const rentLiquidaMensal = diasCorridos > 0 ? (Math.pow(Math.max(valorAtualLiquido, 0.0001) / inv.valorAplicado, 30 / diasCorridos) - 1) * 100 : null;

  const duRestantes = diasUteisEntre(today, inv.dataVencimento);
  const valorEstBrutoVenc = valorAtualBruto * Math.pow(1 + taxaAnual / 100, Math.max(duRestantes, 0) / 252);
  const ganhoEstVenc = valorEstBrutoVenc - inv.valorAplicado;

  const iofAliqVenc = diasAteVencimento < 30 ? aliquotaIOFPorDias(diasAteVencimento) : 0;
  const iofValorVenc = ganhoEstVenc > 0 ? ganhoEstVenc * (iofAliqVenc / 100) : 0;
  const ganhoAposIOFVenc = ganhoEstVenc - iofValorVenc;

  const valorEstLiquidoVenc = valorEstBrutoVenc - iofValorVenc - irValorVenc;

  const pctCDILiquido = cdiMensal !== 0 && rentLiquidaMensal !== null ? (rentLiquidaMensal / cdiMensal) * 100 : null;

  return { diasCorridos, diasTotais, diasRestantes, valorAtualBruto, ganhoBruto, iofAliq, iofValor, aliqIR, irValor,
    valorAtualLiquido, valorEstBrutoVenc, ganhoEstVenc, iofAliqVenc, iofValorVenc, aliqIRVenc, irValorVenc, valorEstLiquidoVenc, taxaAnual, projetado, ancoraData, precisao,
    rentBrutaTotal, rentLiquidaTotal, rentBrutaMensal, rentLiquidaMensal, pctCDIBruto, pctCDILiquido };
}
function buildEvolutionSeries(list, metricsById, today) {
  const events = [];
  list.forEach(inv => {
    events.push({ date: inv.dataAplicacao, id: inv.id, valor: inv.valorAplicado });
    (inv.historico || []).forEach(h => events.push({ date: h.data, id: inv.id, valor: h.valorBruto }));
    if (metricsById && metricsById[inv.id]) events.push({ date: today, id: inv.id, valor: metricsById[inv.id].valorAtualBruto });

function valorProjetadoEm(inv, dataAlvo, ref, today) {
  const hist = (inv.historico || []).slice().sort((a, b) => a.data.localeCompare(b.data));
  let ancoraData = inv.dataAplicacao, ancoraValor = inv.valorAplicado;
  hist.forEach(h => { if (h.data <= dataAlvo) { ancoraData = h.data; ancoraValor = h.valorBruto; } });

function buildAlocacaoInstituicao(ativos, metricsById) {
  const map = {};
  ativos.forEach(inv => {
    const m = metricsById[inv.id];
    if (!map[inv.instituicao]) map[inv.instituicao] = { total: 0, aplicado: 0, ganho: 0 };
    map[inv.instituicao].total += m.valorAtualLiquido;
    map[inv.instituicao].aplicado += inv.valorAplicado;
    map[inv.instituicao].ganho += (m.valorAtualLiquido - inv.valorAplicado);

  const totalGeral = Object.values(map).reduce((a, b) => a + b.total, 0) || 1;

    nome, total: v.total, pctCarteira: (v.total / totalGeral) * 100,

  // BCB SGS:
  // 432 = Meta Selic (% a.a.)
  // 4389 = CDI anualizado, base 252 (% a.a.)
  // 13522 = IPCA acumulado em 12 meses (%)
  const series = { selic: 432, cdi: 4389, ipca: 13522 };
  const entries = await Promise.all(Object.entries(series).map(async ([chave, codigo]) => {
    const resp = await fetch(`https://api.bcb.gov.br/dados/serie/bcdata.sgs.${codigo}/dados/ultimos/1?formato=json`);
    if (!resp.ok) throw new Error('BCB indisponível: ' + chave);
    const json = await resp.json(); const item = json[0];
    return [chave, { valor: parseFloat(item.valor.replace(',', '.')), data: bcbDateToISO(item.data) }];
  }));
  return Object.fromEntries(entries);
}

function App() {
  const [loading, setLoading] = useState(true);
  const [investments, setInvestments] = useState([]);
  const [refTaxas, setRefTaxas] = useState(defaultRef);
  const [taxaStatus, setTaxaStatus] = useState('manual');
  const [historicoIndices, setHistoricoIndices] = useState({ cdi: [], selic: [], status: 'idle' });
  const [tab, setTab] = useState('painel');
  const [filtro, setFiltro] = useState('Ativas');
  const [rankBy, setRankBy] = useState('rentLiquidaMensal');
  const [showForm, setShowForm] = useState(false);
  const [editingId, setEditingId] = useState(null);
  const [form, setForm] = useState(emptyForm);
  const [formError, setFormError] = useState('');
  const [expandedId, setExpandedId] = useState(null);
  const [historicoDraft, setHistoricoDraft] = useState({ data: todayStr(), valor: '' });
  const [resgateDraft, setResgateDraft] = useState({ data: todayStr(), valor: '' });
  const [resgatandoId, setResgatandoId] = useState(null);
  const today = todayStr();

  const refreshTaxas = useCallback(() => {
    setTaxaStatus('carregando');
    fetchTaxasBCB().then(data => {
      const novo = {
        cdi: data.cdi.valor,
        selic: data.selic.valor,
        ipca: data.ipca.valor,
        dataCDI: data.cdi.data,
        dataSelic: data.selic.data,
        dataIPCA: data.ipca.data,
        atualizado: today,
        fonte: 'bcb'
      };
      setRefTaxas(novo); setTaxaStatus('conectado'); storage.set('rf-taxas-referencia', JSON.stringify(novo));
    }).catch(() => setTaxaStatus('offline'));
  }, [today]);

  useEffect(() => {
    (async () => {
      const r = await storage.get('rf-investimentos'); if (r) { try { setInvestments(JSON.parse(r.value)); } catch (e) {} }
      const r2 = await storage.get('rf-taxas-referencia'); if (r2) { try { setRefTaxas(JSON.parse(r2.value)); } catch (e) {} }
      setLoading(false); refreshTaxas();
    })();
    const interval = setInterval(refreshTaxas, 6 * 60 * 60 * 1000);
    return () => clearInterval(interval);
    // eslint-disable-next-line
  }, []);

  const minDataCDI = useMemo(() => { const d = investments.filter(i => i.indexador === 'CDI').map(i => i.dataAplicacao).sort(); return d.length ? d[0] : null; }, [investments]);
  const minDataSelic = useMemo(() => { const d = investments.filter(i => i.indexador === 'SELIC').map(i => i.dataAplicacao).sort(); return d.length ? d[0] : null; }, [investments]);

  useEffect(() => {
    if (!minDataCDI && !minDataSelic) return;
    let cancelado = false;
    (async () => {
      setHistoricoIndices(h => ({ ...h, status: 'carregando' }));
      try {
        const [cdi, selic] = await Promise.all([
          minDataCDI ? fetchHistoricoDiario(12, minDataCDI, today) : Promise.resolve([]),
          minDataSelic ? fetchHistoricoDiario(11, minDataSelic, today) : Promise.resolve([]),
        ]);
        if (!cancelado) setHistoricoIndices({ cdi, selic, status: 'ok' });
      } catch (e) { if (!cancelado) setHistoricoIndices(h => ({ ...h, status: 'erro' })); }
    })();
    return () => { cancelado = true; };
  }, [minDataCDI, minDataSelic, today]);

  const refComHistorico = useMemo(() => ({ ...refTaxas, historicoCDI: historicoIndices.cdi, historicoSelic: historicoIndices.selic }), [refTaxas, historicoIndices]);

  async function persist(list) { setInvestments(list); await storage.set('rf-investimentos', JSON.stringify(list)); }
  async function persistRefManual(r) { setRefTaxas(r); setTaxaStatus('manual'); await storage.set('rf-taxas-referencia', JSON.stringify(r)); }

  function openNew() { setForm(emptyForm); setEditingId(null); setFormError(''); setShowForm(true); }
  function openEdit(inv) { setForm({ ...inv, valorAplicado: String(inv.valorAplicado), parametroValor: inv.parametroValor ?? '', aliquotaIRManual: inv.aliquotaIRManual ?? '', taxaOverrideAnual: inv.taxaOverrideAnual ?? '', carteira: inv.carteira || '' }); setEditingId(inv.id); setFormError(''); setShowForm(true); }
  function handleTipoChange(tipo) { setForm(f => ({ ...f, tipo, isentoIR: TIPO_META[tipo].isentoDefault })); }

  function handleSave() {
    if (!form.instituicao.trim()) return setFormError('Informe a instituição / emissor.');
    if (!form.dataAplicacao) return setFormError('Informe a data de aplicação.');
    if (!form.dataVencimento) return setFormError('Informe a data de vencimento.');
    if (form.dataVencimento <= form.dataAplicacao) return setFormError('O vencimento deve ser após a data de aplicação.');
    const valor = Number(form.valorAplicado);
    if (!valor || valor <= 0) return setFormError('Informe um valor aplicado válido.');
    const campos = { instituicao: form.instituicao.trim(), tipo: form.tipo, indexador: form.indexador, parametroValor: form.parametroValor === '' ? 0 : Number(form.parametroValor), dataAplicacao: form.dataAplicacao, dataVencimento: form.dataVencimento, valorAplicado: valor, liquidez: form.liquidez, isentoIR: !!form.isentoIR, aliquotaIRManual: form.aliquotaIRManual === '' ? '' : Number(form.aliquotaIRManual), taxaOverrideAnual: form.taxaOverrideAnual === '' ? '' : Number(form.taxaOverrideAnual), carteira: form.carteira.trim(), observacoes: form.observacoes };
    if (editingId) {
      persist(investments.map(inv => inv.id === editingId ? { ...inv, ...campos, historico: (inv.historico && inv.historico.length) ? inv.historico.map(h => (h.data === inv.dataAplicacao && h.valorBruto === inv.valorAplicado) ? { ...h, data: campos.dataAplicacao, valorBruto: valor } : h) : [{ id: uid(), data: campos.dataAplicacao, valorBruto: valor }] } : inv));
    } else {
      persist([...investments, { id: uid(), ...campos, status: 'ativo', historico: [{ id: uid(), data: campos.dataAplicacao, valorBruto: valor }] }]);
    }
    setShowForm(false);
  }
  function deleteInvestment(id) { if (!window.confirm('Remover esta aplicação definitivamente? Essa ação não pode ser desfeita.')) return; persist(investments.filter(inv => inv.id !== id)); }
  function addHistorico(invId) { const valor = Number(historicoDraft.valor); if (!valor || valor <= 0 || !historicoDraft.data) return; persist(investments.map(inv => inv.id !== invId ? inv : { ...inv, historico: [...(inv.historico || []).filter(h => h.data !== historicoDraft.data), { id: uid(), data: historicoDraft.data, valorBruto: valor }] })); setHistoricoDraft({ data: todayStr(), valor: '' }); }
  function confirmResgate(invId) { const valor = Number(resgateDraft.valor); if (!valor || !resgateDraft.data) return; persist(investments.map(inv => inv.id === invId ? { ...inv, status: 'resgatado', dataResgate: resgateDraft.data, valorLiquidoRecebido: valor } : inv)); setResgatandoId(null); setResgateDraft({ data: todayStr(), valor: '' }); }
  function reabrir(invId) { persist(investments.map(inv => inv.id === invId ? { ...inv, status: 'ativo', dataResgate: undefined, valorLiquidoRecebido: undefined } : inv)); }

  const ativos = useMemo(() => investments.filter(i => i.status === 'ativo'), [investments]);
  const resgatados = useMemo(() => investments.filter(i => i.status === 'resgatado'), [investments]);
  const metricsById = useMemo(() => { const map = {}; investments.forEach(inv => { map[inv.id] = calcMetrics(inv, today, refComHistorico); }); return map; }, [investments, today, refComHistorico]);
  const totais = useMemo(() => ativos.reduce((acc, inv) => { const m = metricsById[inv.id]; acc.aplicado += inv.valorAplicado; acc.bruto += m.valorAtualBruto; acc.liquido += m.valorAtualLiquido; acc.estimadoVenc += m.valorEstLiquidoVenc; return acc; }, { aplicado: 0, bruto: 0, liquido: 0, estimadoVenc: 0 }), [ativos, metricsById]);
  const ganhoLiquido = totais.liquido - totais.aplicado;
  const rentLiquida = totais.aplicado > 0 ? (ganhoLiquido / totais.aplicado) * 100 : 0;
  const porTipo = useMemo(() => { const map = {}; ativos.forEach(inv => { map[inv.tipo] = (map[inv.tipo] || 0) + metricsById[inv.id].valorAtualBruto; }); return Object.entries(map).map(([tipo, valor]) => ({ name: tipo, value: valor, cor: TIPO_META[tipo]?.cor || C.muted })); }, [ativos, metricsById]);
  const porIndexador = useMemo(() => { const map = {}; ativos.forEach(inv => { map[inv.indexador] = (map[inv.indexador] || 0) + metricsById[inv.id].valorAtualBruto; }); return Object.entries(map).map(([nome, valor]) => ({ name: nome, value: valor, cor: INDEXADOR_COR[nome] || C.muted })); }, [ativos, metricsById]);
  const porInstituicao = useMemo(() => { const map = {}; ativos.forEach(inv => { map[inv.instituicao] = (map[inv.instituicao] || 0) + metricsById[inv.id].valorAtualBruto; }); return Object.entries(map).map(([nome, valor]) => ({ name: nome, valor })).sort((a, b) => b.valor - a.valor).slice(0, 8); }, [ativos, metricsById]);
  const calendarioVencimentos = useMemo(() => { const meses = []; const base = new Date(); for (let i = 0; i < 12; i++) { const d = new Date(base.getFullYear(), base.getMonth() + i, 1); meses.push({ key: `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}`, label: d.toLocaleDateString('pt-BR', { month: 'short', year: '2-digit' }), valor: 0 }); } ativos.forEach(inv => { const key = inv.dataVencimento.slice(0, 7); const alvo = meses.find(m => m.key === key); if (alvo) alvo.valor += metricsById[inv.id].valorAtualBruto; }); return meses; }, [ativos, metricsById]);
  const evolucao = useMemo(() => buildEvolutionSeries(ativos, metricsById, today), [ativos, metricsById, today]);
  const proximosVencimentos = useMemo(() => ativos.slice().sort((a, b) => a.dataVencimento.localeCompare(b.dataVencimento)).slice(0, 6), [ativos]);
  const listaFiltrada = useMemo(() => { let base = investments; if (filtro === 'Ativas') base = investments.filter(i => i.status === 'ativo' && metricsById[i.id].diasRestantes >= 0); if (filtro === 'Vencidas') base = investments.filter(i => i.status === 'ativo' && metricsById[i.id].diasRestantes < 0); if (filtro === 'Resgatadas') base = investments.filter(i => i.status === 'resgatado'); return base.slice().sort((a, b) => a.dataVencimento.localeCompare(b.dataVencimento)); }, [investments, filtro, metricsById]);
  const ranking = useMemo(() => { const list = ativos.slice(); const cmp = { rentLiquidaMensal: (a, b) => (metricsById[b.id].rentLiquidaMensal ?? -999) - (metricsById[a.id].rentLiquidaMensal ?? -999), rentLiquidaTotal: (a, b) => metricsById[b.id].rentLiquidaTotal - metricsById[a.id].rentLiquidaTotal, vencimento: (a, b) => a.dataVencimento.localeCompare(b.dataVencimento), valorAplicado: (a, b) => b.valorAplicado - a.valorAplicado }; return list.sort(cmp[rankBy]); }, [ativos, metricsById, rankBy]);

  return <div style={{ background: C.bg, color: C.text, minHeight: '100vh', fontFamily: "'Inter', sans-serif" }}>
    <header style={{ background: C.bg, position: 'sticky', top: 0, zIndex: 10 }} className="px-4">
      <div style={{ maxWidth: 1152, margin: '0 auto', padding: '20px 16px 4px', display: 'flex', alignItems: 'center', justifyContent: 'space-between', flexWrap: 'wrap', gap: 16 }}>
        <div style={{ display: 'flex', alignItems: 'center', gap: 12 }}>
          <div style={{ width: 32, height: 32, borderRadius: 9, background: C.lime, color: '#10160A', display: 'flex', alignItems: 'center', justifyContent: 'center', fontWeight: 800, fontFamily: "'IBM Plex Mono', monospace", fontSize: 14 }}>R</div>
          <div><div style={{ fontWeight: 700, fontSize: 15 }}>Razão</div><div style={{ color: C.muted, fontSize: 10.5 }}>Controle de renda fixa</div></div>
        </div>
        <button onClick={openNew} style={{ background: C.lime, color: '#10160A', border: 'none', borderRadius: 10, padding: '10px 16px', fontWeight: 700, fontSize: 13, display: 'flex', alignItems: 'center', gap: 6, cursor: 'pointer' }}><Icon name="plus" size={15} /> Nova aplicação</button>
      </div>
      <TaxasBar refTaxas={refTaxas} status={taxaStatus} onRefresh={refreshTaxas} onSaveManual={persistRefManual} historicoStatus={historicoIndices.status} historicoCDICount={historicoIndices.cdi.length} historicoSelicCount={historicoIndices.selic.length} />
      <div style={{ maxWidth: 1152, margin: '0 auto', display: 'flex', gap: 4, padding: '0 16px 14px' }}>
        {[['painel', 'Painel', 'grid'], ['ranking', 'Ranking', 'listOrdered'], ['lista', 'Aplicações', 'listChecks']].map(([t, lbl, ic]) => (
          <button key={t} onClick={() => setTab(t)} style={{ background: tab === t ? C.panel : 'transparent', border: 'none', cursor: 'pointer', padding: '8px 14px', borderRadius: 10, color: tab === t ? C.lime : C.muted, fontWeight: 700, fontSize: 13, display: 'flex', alignItems: 'center', gap: 6 }}><Icon name={ic} size={14} /> {lbl}</button>
        ))}
      </div>
    </header>

    <main style={{ maxWidth: 1152, margin: '0 auto', padding: '24px 16px' }}>
      {loading ? <div style={{ color: C.muted, padding: 40, textAlign: 'center' }}>Carregando seu livro-razão…</div>
      : investments.length === 0 ? (
        <div style={{ border: `1px dashed ${C.panel2}`, borderRadius: 16, padding: '48px 24px', textAlign: 'center' }}>
          <div style={{ display: 'flex', justifyContent: 'center', marginBottom: 12 }}><Icon name="wallet" size={26} color={C.lime} /></div>
          <p style={{ fontSize: 17, fontWeight: 700, marginBottom: 6 }}>Nenhuma aplicação registrada</p>
          <p style={{ color: C.muted, fontSize: 13.5, marginBottom: 18 }}>Adicione a primeira para começar seu controle de renda fixa.</p>
          <button onClick={openNew} style={{ background: C.lime, color: '#10160A', border: 'none', borderRadius: 10, padding: '10px 18px', fontWeight: 700, cursor: 'pointer', fontSize: 13.5 }}>Adicionar aplicação</button>
        </div>
      ) : <>
        <Hero liquido={totais.liquido} deltaPct={rentLiquida} ganho={ganhoLiquido} />
        <div style={{ display: 'grid', gridTemplateColumns: 'repeat(auto-fit, minmax(220px, 1fr))', gap: 12, marginBottom: 28 }}>
          <StatCard label="Aplicado (bruto)" value={fmtBRL(totais.aplicado)} sub="capital investido" />
          <StatCard label="Valor atual bruto" value={fmtBRL(totais.bruto)} sub="antes de IR/IOF" />
          <StatCard label="Estimado líquido no vencimento" value={fmtBRL(totais.estimadoVenc)} accent={C.lime} sub="pelas taxas de referência atuais" />
        </div>
        {tab === 'painel' && <Dashboard porTipo={porTipo} porIndexador={porIndexador} porInstituicao={porInstituicao} calendarioVencimentos={calendarioVencimentos} evolucao={evolucao} proximosVencimentos={proximosVencimentos} metricsById={metricsById} resgatados={resgatados} ativos={ativos} totais={totais} ganhoLiquido={ganhoLiquido} refTaxas={refComHistorico} today={today} />}
        {tab === 'ranking' && <RankingTab ranking={ranking} metricsById={metricsById} refTaxas={refComHistorico} rankBy={rankBy} setRankBy={setRankBy} />}
        {tab === 'lista' && <ListaAplicacoes filtro={filtro} setFiltro={setFiltro} lista={listaFiltrada} metricsById={metricsById} refTaxas={refComHistorico} expandedId={expandedId} setExpandedId={setExpandedId} openEdit={openEdit} deleteInvestment={deleteInvestment} historicoDraft={historicoDraft} setHistoricoDraft={setHistoricoDraft} addHistorico={addHistorico} resgatandoId={resgatandoId} setResgatandoId={setResgatandoId} resgateDraft={resgateDraft} setResgateDraft={setResgateDraft} confirmResgate={confirmResgate} reabrir={reabrir} />}
      </>}
    </main>
    {showForm && <FormModal form={form} setForm={setForm} editingId={editingId} formError={formError} refTaxas={refComHistorico} onClose={() => setShowForm(false)} onSave={handleSave} onTipoChange={handleTipoChange} />}
  </div>;
}

function Dashboard({ porTipo, porIndexador, porInstituicao, calendarioVencimentos, evolucao, proximosVencimentos, metricsById, resgatados, ativos, totais, ganhoLiquido, refTaxas, today }) {
  const composicaoPie = [
    { name: 'Aplicado (principal)', value: totais.aplicado, cor: C.blue },
    { name: 'Rendimento líquido', value: Math.max(ganhoLiquido, 0), cor: C.lime },
  ];
  const composicaoTabela = ativos.slice().sort((a, b) => metricsById[b.id].valorAtualLiquido - metricsById[a.id].valorAtualLiquido);
  const matrizMensal = useMemo(() => buildRentabilidadeMensalMatrix(ativos, refTaxas, today), [ativos, refTaxas, today]);
  const alocacaoInstituicao = useMemo(() => buildAlocacaoInstituicao(ativos, metricsById), [ativos, metricsById]);
  return <div style={{ display: 'flex', flexDirection: 'column', gap: 20 }}>
    <Panel title="Rentabilidade mensal e acumulada" subtitle="retorno líquido da carteira mês a mês, comparado ao CDI do mesmo período — ponderado pelo valor de cada título, sem distorção por aportes">
      {matrizMensal.anos.length === 0 ? <p style={{ color: C.muted, fontSize: 13 }}>Sem dados suficientes ainda.</p> : (
        <div className="scrollbar-thin" style={{ overflowX: 'auto' }}><table style={{ width: '100%', borderCollapse: 'collapse', minWidth: 760 }}>
          <thead><tr style={{ borderBottom: `1px solid ${C.hairline}` }}>
            <th style={{ textAlign: 'left', color: C.muted, fontSize: 10, textTransform: 'uppercase', padding: '6px 8px', fontWeight: 700 }}></th>
            {MESES_ABREV.map(mm => <th key={mm} style={{ textAlign: 'right', color: C.muted, fontSize: 10, textTransform: 'uppercase', padding: '6px 8px', fontWeight: 700 }}>{mm}</th>)}
            <th style={{ textAlign: 'right', color: C.muted, fontSize: 10, textTransform: 'uppercase', padding: '6px 8px', fontWeight: 700 }}>Ano</th>
          </tr></thead>
          <tbody>{matrizMensal.anos.map(ano => {
            const carteira = matrizMensal.dados[ano].carteira, cdi = matrizMensal.dados[ano].cdi;
            const acumCarteira = (carteira.filter(v => v !== null).reduce((f, v) => f * (1 + v / 100), 1) - 1) * 100;
            const acumCDI = (cdi.filter(v => v !== null).reduce((f, v) => f * (1 + v / 100), 1) - 1) * 100;
            return <React.Fragment key={ano}>
              <tr style={{ borderTop: `1px solid ${C.hairline}` }}>
                <td style={{ padding: '5px 8px', fontSize: 12, fontWeight: 700 }}>{ano}</td>
                {carteira.map((v, i) => <td key={i} style={{ padding: '5px 8px', textAlign: 'right', fontFamily: "'IBM Plex Mono', monospace", fontSize: 11.5, color: v === null ? C.hairline : v >= 0 ? C.lime : C.red }}>{v === null ? '—' : fmtPct(v)}</td>)}
                <td style={{ padding: '5px 8px', textAlign: 'right', fontFamily: "'IBM Plex Mono', monospace", fontSize: 11.5, fontWeight: 700, color: acumCarteira >= 0 ? C.lime : C.red }}>{fmtPct(acumCarteira)}</td>
              </tr>
              <tr>
                <td style={{ padding: '2px 8px 10px', fontSize: 10.5, color: C.muted }}>CDI</td>
                {cdi.map((v, i) => <td key={i} style={{ padding: '2px 8px 10px', textAlign: 'right', fontFamily: "'IBM Plex Mono', monospace", fontSize: 10.5, color: C.muted }}>{v === null ? '—' : fmtPct(v)}</td>)}
                <td style={{ padding: '2px 8px 10px', textAlign: 'right', fontFamily: "'IBM Plex Mono', monospace", fontSize: 10.5, color: C.muted }}>{fmtPct(acumCDI)}</td>
              </tr>
            </React.Fragment>;
          })}</tbody>
        </table></div>
      )}
    </Panel>
    <Panel title="Alocação por instituição" subtitle="total, participação na carteira e rentabilidade líquida acumulada por emissor">
      <div className="scrollbar-thin" style={{ overflowX: 'auto' }}><table style={{ width: '100%', borderCollapse: 'collapse', minWidth: 480 }}>
        <thead><tr style={{ borderBottom: `1px solid ${C.hairline}` }}>{['Instituição', 'Total líquido', '% carteira', 'Rent. líquida'].map(h => <th key={h} style={{ textAlign: 'left', color: C.muted, fontSize: 10, textTransform: 'uppercase', padding: '6px 8px', whiteSpace: 'nowrap', fontWeight: 700 }}>{h}</th>)}</tr></thead>
        <tbody>{alocacaoInstituicao.map(a => (
          <tr key={a.nome} style={{ borderBottom: `1px solid ${C.hairline}` }}>
            <td style={{ padding: '7px 8px', fontSize: 12.5, fontWeight: 600 }}>{a.nome}</td>
            <td style={{ padding: '7px 8px', fontFamily: "'IBM Plex Mono', monospace", fontSize: 12.5 }}>{fmtBRL(a.total)}</td>
            <td style={{ padding: '7px 8px', fontFamily: "'IBM Plex Mono', monospace", fontSize: 12.5 }}>{fmtPct(a.pctCarteira)}</td>
            <td style={{ padding: '7px 8px', fontFamily: "'IBM Plex Mono', monospace", fontSize: 12.5, color: a.rentLiquida >= 0 ? C.lime : C.red }}>{fmtPct(a.rentLiquida)}</td>
          </tr>
        ))}</tbody>
      </table></div>
    </Panel>
    <Panel title="Aplicado x rendimento" subtitle="quanto do seu saldo atual é capital investido e quanto é rendimento acumulado">
      <div style={{ display: 'grid', gridTemplateColumns: 'repeat(auto-fit, minmax(280px, 1fr))', gap: 20 }}>
        <PieBlock data={composicaoPie} />
        <div className="scrollbar-thin" style={{ overflowX: 'auto', maxHeight: 260, overflowY: 'auto' }}>
          <table style={{ width: '100%', borderCollapse: 'collapse', minWidth: 380 }}>
            <thead><tr style={{ borderBottom: `1px solid ${C.hairline}` }}>
              {['Título', 'Aplicado', 'Rendimento líq.', '% rendimento'].map(h => <th key={h} style={{ textAlign: 'left', color: C.muted, fontSize: 10, textTransform: 'uppercase', padding: '6px 8px', whiteSpace: 'nowrap', fontWeight: 700 }}>{h}</th>)}
            </tr></thead>
            <tbody>{composicaoTabela.map(inv => { const m = metricsById[inv.id]; const rendimento = m.valorAtualLiquido - inv.valorAplicado; const pctRendimento = m.valorAtualLiquido > 0 ? (rendimento / m.valorAtualLiquido) * 100 : 0; return (
              <tr key={inv.id} style={{ borderBottom: `1px solid ${C.hairline}` }}>
                <td style={{ padding: '6px 8px', fontSize: 12 }}>{inv.instituicao}</td>
                <td style={{ padding: '6px 8px', fontFamily: "'IBM Plex Mono', monospace", fontSize: 12 }}>{fmtBRL(inv.valorAplicado)}</td>
                <td style={{ padding: '6px 8px', fontFamily: "'IBM Plex Mono', monospace", fontSize: 12, color: rendimento >= 0 ? C.lime : C.red }}>{fmtBRL(rendimento)}</td>
                <td style={{ padding: '6px 8px', fontFamily: "'IBM Plex Mono', monospace", fontSize: 12 }}>{fmtPct(pctRendimento)}</td>
              </tr>
            ); })}</tbody>
          </table>
        </div>
      </div>
    </Panel>
    <Panel title="Evolução do patrimônio" subtitle="soma do valor bruto das aplicações ativas, com projeção diária pela taxa de referência">
      <MiniLineChart data={evolucao} valueKey="total" labelKey="date" color={C.lime} />
    </Panel>
    <div style={{ display: 'grid', gridTemplateColumns: 'repeat(auto-fit, minmax(280px, 1fr))', gap: 20 }}>
      <Panel title="Distribuição por tipo"><PieBlock data={porTipo} /></Panel>
      <Panel title="Distribuição por indexador"><PieBlock data={porIndexador} /></Panel>
    </div>
    <Panel title="Concentração por instituição" subtitle="valor atual bruto por emissor">
      <SimpleBarsHorizontal data={porInstituicao} labelKey="name" valueKey="valor" color={C.blue} />
    </Panel>
    <Panel title="Calendário de vencimentos" subtitle="valor bruto a vencer nos próximos 12 meses">
      <SimpleBarsVertical data={calendarioVencimentos} labelKey="label" valueKey="valor" color={C.lime} />
    </Panel>
    <Panel title="Próximos vencimentos">
      {proximosVencimentos.length === 0 ? <p style={{ color: C.muted, fontSize: 13 }}>Nenhuma aplicação ativa.</p> : <div style={{ display: 'flex', flexDirection: 'column', gap: 12 }}>
        {proximosVencimentos.map(inv => { const m = metricsById[inv.id]; return (
          <div key={inv.id} style={{ display: 'flex', alignItems: 'center', gap: 12, borderBottom: `1px solid ${C.hairline}`, paddingBottom: 10 }}>
            <TipoTag tipo={inv.tipo} />
            <div style={{ flex: 1, minWidth: 0 }}><div style={{ fontWeight: 600, fontSize: 13.5 }}>{inv.instituicao}</div><div style={{ color: C.muted, fontSize: 11.5 }}>vence em {fmtData(inv.dataVencimento)} {m.diasRestantes >= 0 ? `(${m.diasRestantes} dias)` : '(vencida)'}</div></div>
            <div style={{ fontFamily: "'IBM Plex Mono', monospace", fontSize: 13.5 }}>{fmtBRL(m.valorAtualBruto)}</div>
          </div>); })}
      </div>}
    </Panel>
    {resgatados.length > 0 && <Panel title="Resgates realizados">
      <div style={{ display: 'flex', flexDirection: 'column', gap: 8 }}>
        {resgatados.map(inv => { const ganho = inv.valorLiquidoRecebido - inv.valorAplicado; const rent = inv.valorAplicado > 0 ? (ganho / inv.valorAplicado) * 100 : 0; return (
          <div key={inv.id} style={{ display: 'flex', justifyContent: 'space-between', fontSize: 13, borderBottom: `1px solid ${C.hairline}`, paddingBottom: 8 }}>
            <span>{inv.instituicao} <span style={{ color: C.muted }}>· resgatado em {fmtData(inv.dataResgate)}</span></span>
            <span style={{ fontFamily: "'IBM Plex Mono', monospace", color: ganho >= 0 ? C.lime : C.red }}>{fmtBRL(inv.valorLiquidoRecebido)} ({fmtPct(rent)})</span>
          </div>); })}
      </div>
    </Panel>}
  </div>;
}

function RankingTab({ ranking, metricsById, refTaxas, rankBy, setRankBy }) {
  const opts = [['rentLiquidaMensal', 'Rentabilidade líquida mensal'], ['rentLiquidaTotal', 'Rentabilidade líquida total'], ['vencimento', 'Vencimento mais próximo'], ['valorAplicado', 'Maior valor aplicado']];
  return <Panel title="Classificação: do melhor para o pior" subtitle="aplicações ativas ordenadas pelo critério escolhido" right={<select style={{ ...inputStyle, width: 230 }} value={rankBy} onChange={e => setRankBy(e.target.value)}>{opts.map(([v, l]) => <option key={v} value={v}>{l}</option>)}</select>}>
    {ranking.length === 0 ? <p style={{ color: C.muted, fontSize: 13 }}>Nenhuma aplicação ativa para classificar.</p> : (
      <div className="scrollbar-thin" style={{ overflowX: 'auto' }}><table style={{ width: '100%', borderCollapse: 'collapse', minWidth: 700 }}>
        <thead><tr style={{ borderBottom: `1px solid ${C.hairline}` }}>{['#', 'Título', 'Taxa contratada', 'Rent. bruta/mês', 'Rent. líquida/mês', '% do CDI', 'Valor atual líquido', 'Vencimento'].map(h => <th key={h} style={{ textAlign: 'left', color: C.muted, fontSize: 10, textTransform: 'uppercase', padding: '8px 10px', whiteSpace: 'nowrap', fontWeight: 700 }}>{h}</th>)}</tr></thead>
        <tbody>{ranking.map((inv, i) => { const m = metricsById[inv.id]; const melhor = i === 0, pior = i === ranking.length - 1 && ranking.length > 1; return (
          <tr key={inv.id} style={{ borderBottom: `1px solid ${C.hairline}`, background: melhor ? C.lime + '10' : pior ? C.red + '10' : 'transparent' }}>
            <td style={{ padding: 10, fontFamily: "'IBM Plex Mono', monospace", color: melhor ? C.lime : pior ? C.red : C.muted, fontWeight: 700, fontSize: 13 }}>{i + 1}{melhor && <span style={{ marginLeft: 4, display: 'inline-flex', verticalAlign: '-2px' }}><Icon name="trophy" size={11} /></span>}</td>
            <td style={{ padding: 10 }}><div style={{ display: 'flex', alignItems: 'center', gap: 8 }}><TipoTag tipo={inv.tipo} /><span style={{ fontWeight: 600, fontSize: 13 }}>{inv.instituicao}</span></div></td>
            <td style={{ padding: 10, fontSize: 11.5, color: C.muted, whiteSpace: 'nowrap' }}>{descricaoTaxa(inv, refTaxas)}</td>
            <td style={{ padding: 10, fontFamily: "'IBM Plex Mono', monospace", fontSize: 12.5 }}>{fmtPct(m.rentBrutaMensal)}</td>
            <td style={{ padding: 10 }}><Delta value={m.rentLiquidaMensal} size={12.5} /></td>
            <td style={{ padding: 10, fontFamily: "'IBM Plex Mono', monospace", fontSize: 12.5, color: m.pctCDILiquido !== null && m.pctCDILiquido >= 100 ? C.lime : C.text }}>{m.pctCDILiquido !== null ? fmtPct(m.pctCDILiquido) : '—'}</td>
            <td style={{ padding: 10, fontFamily: "'IBM Plex Mono', monospace", fontSize: 12.5 }}>{fmtBRL(m.valorAtualLiquido)}</td>
            <td style={{ padding: 10, fontSize: 11.5, whiteSpace: 'nowrap' }}>{fmtData(inv.dataVencimento)}</td>
          </tr>); })}</tbody>
      </table></div>
    )}
  </Panel>;
}

function exportarCSV(lista, metricsById, refTaxas) {
  const header = ['Instituição', 'Tipo', 'Indexador', 'Taxa contratada', 'Carteira', 'Data aplicação', 'Data vencimento', 'Valor aplicado', 'Valor atual bruto', 'Valor atual líquido', 'Rent. líquida mensal %', 'Rent. líquida total %', '% do CDI líquido', 'Status'];
  const linhas = lista.map(inv => { const m = metricsById[inv.id]; return [inv.instituicao, inv.tipo, inv.indexador, descricaoTaxa(inv, refTaxas), inv.carteira || '', fmtData(inv.dataAplicacao), fmtData(inv.dataVencimento), inv.valorAplicado.toFixed(2), m.valorAtualBruto.toFixed(2), m.valorAtualLiquido.toFixed(2), m.rentLiquidaMensal !== null ? m.rentLiquidaMensal.toFixed(2) : '', m.rentLiquidaTotal.toFixed(2), m.pctCDILiquido !== null ? m.pctCDILiquido.toFixed(1) : '', inv.status].map(v => `"${String(v).replace(/"/g, '""')}"`).join(';'); });
  const csv = '\uFEFF' + [header.join(';'), ...linhas].join('\n');
  const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a'); a.href = url; a.download = `razao-aplicacoes-${todayStr()}.csv`; a.click();
  URL.revokeObjectURL(url);
}

function ListaAplicacoes({ filtro, setFiltro, lista, metricsById, refTaxas, expandedId, setExpandedId, openEdit, deleteInvestment, historicoDraft, setHistoricoDraft, addHistorico, resgatandoId, setResgatandoId, resgateDraft, setResgateDraft, confirmResgate, reabrir }) {
  return <div>
    <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between', flexWrap: 'wrap', gap: 8, marginBottom: 20 }}>
      <div style={{ display: 'flex', gap: 8, flexWrap: 'wrap' }}>{['Ativas', 'Vencidas', 'Resgatadas', 'Todas'].map(f => <button key={f} onClick={() => setFiltro(f)} style={{ background: filtro === f ? C.lime : C.panel, color: filtro === f ? '#10160A' : C.muted, border: 'none', borderRadius: 10, padding: '7px 14px', fontSize: 12.5, fontWeight: 700, cursor: 'pointer' }}>{f}</button>)}</div>
      {lista.length > 0 && <button onClick={() => exportarCSV(lista, metricsById, refTaxas)} style={{ background: C.panel, color: C.mutedLight, border: 'none', borderRadius: 10, padding: '7px 14px', fontSize: 12.5, fontWeight: 700, cursor: 'pointer' }}>Exportar CSV</button>}
    </div>
    {lista.length === 0 ? <p style={{ color: C.muted, fontSize: 14 }}>Nenhuma aplicação nesse filtro.</p> : (
      <div style={{ display: 'flex', flexDirection: 'column', gap: 12 }}>{lista.map(inv => {
        const m = metricsById[inv.id]; const vencida = inv.status === 'ativo' && m.diasRestantes < 0; const expanded = expandedId === inv.id;
        const hist = (inv.historico || []).slice().sort((a, b) => b.data.localeCompare(a.data));
        return <div key={inv.id} style={{ background: C.panel, borderRadius: 16, padding: 16, boxShadow: shadow, borderTop: `1px solid ${vencida ? C.red + '55' : C.hairline}` }}>
          <div style={{ display: 'flex', alignItems: 'flex-start', gap: 12, flexWrap: 'wrap' }}>
            <div style={{ flex: 1, minWidth: 200 }}>
              <div style={{ display: 'flex', alignItems: 'center', gap: 8, flexWrap: 'wrap' }}>
                <TipoTag tipo={inv.tipo} /><span style={{ fontWeight: 700, fontSize: 14.5 }}>{inv.instituicao}</span>
                {inv.status === 'resgatado' && <Badge cor={C.slate} texto="Resgatado" />}
                {vencida && <Badge cor={C.red} texto="Vencida" icon={<Icon name="alert" size={11} />} />}
                {inv.isentoIR && <Badge cor={C.lime} texto="Isento IR" />}
                {inv.carteira && <Badge cor={C.blue} texto={inv.carteira} />}
              </div>
              <div style={{ color: C.muted, fontSize: 11.5, marginTop: 5 }}>{descricaoTaxa(inv, refTaxas)} · aplicado em {fmtData(inv.dataAplicacao)} · vence em {fmtData(inv.dataVencimento)} · {inv.liquidez}</div>
              <div style={{ marginTop: 10, maxWidth: 340 }}><MaturityBar diasCorridos={m.diasCorridos} diasTotais={m.diasTotais} vencida={vencida} /><div style={{ color: C.muted, fontSize: 10.5, marginTop: 4 }}>{inv.status === 'ativo' ? (m.diasRestantes >= 0 ? `${m.diasRestantes} dias até o vencimento` : `vencida há ${Math.abs(m.diasRestantes)} dias`) : `resgatado em ${fmtData(inv.dataResgate)}`}</div></div>
            </div>
            <div style={{ display: 'flex', gap: 4 }}>
              <IconBtn onClick={() => openEdit(inv)} title="Editar"><Icon name="pencil" size={14} /></IconBtn>
              <IconBtn onClick={() => setExpandedId(expanded ? null : inv.id)} title="Detalhes"><Icon name={expanded ? 'chevronUp' : 'chevronDown'} size={14} /></IconBtn>
              <IconBtn onClick={() => deleteInvestment(inv.id)} title="Excluir" danger><Icon name="trash" size={14} /></IconBtn>
            </div>
          </div>
          <div style={{ display: 'grid', gridTemplateColumns: 'repeat(auto-fit,minmax(120px,1fr))', gap: 12, marginTop: 16 }}>
            <Mini label="Aplicado (bruto)" value={fmtBRL(inv.valorAplicado)} />
            <Mini label={m.projetado ? 'Atual (bruto) · projetado' : 'Atual (bruto)'} value={fmtBRL(m.valorAtualBruto)} />
            <Mini label={m.projetado ? 'Atual (líquido) · projetado' : 'Atual (líquido)'} value={fmtBRL(m.valorAtualLiquido)} accent={C.lime} />
            <Mini label="Estimado líquido no venc." value={fmtBRL(m.valorEstLiquidoVenc)} accent={C.blue} />
          </div>
          {m.projetado && <div style={{ color: C.muted, fontSize: 10.5, marginTop: 4 }}>{m.precisao === 'historico' ? `composto dia a dia com o histórico real do CDI/Selic desde ${fmtData(m.ancoraData)}` : `projetado a partir de ${fmtData(m.ancoraData)} pela taxa efetiva atual (${fmtPct(m.taxaAnual)} a.a.) — lance um valor real do extrato quando quiser corrigir`}</div>}
          <div style={{ display: 'grid', gridTemplateColumns: 'repeat(auto-fit,minmax(120px,1fr))', gap: 12, marginTop: 12 }}>
            <Mini label="Rent. bruta / mês" value={fmtPct(m.rentBrutaMensal)} />
            <div><div style={{ color: C.muted, fontSize: 10, textTransform: 'uppercase', fontWeight: 700 }}>Rent. líquida / mês</div><Delta value={m.rentLiquidaMensal} size={13.5} /></div>
            <Mini label="Rent. líquida total" value={fmtPct(m.rentLiquidaTotal)} />
            <Mini label="% do CDI (líquido)" value={m.pctCDILiquido !== null ? fmtPct(m.pctCDILiquido) : '—'} accent={m.pctCDILiquido !== null && m.pctCDILiquido >= 100 ? C.lime : C.text} />
          </div>
          {expanded && <div style={{ marginTop: 16, borderTop: `1px solid ${C.hairline}`, paddingTop: 16, display: 'flex', flexDirection: 'column', gap: 20 }}>
            <div style={{ display: 'grid', gridTemplateColumns: 'repeat(auto-fit,minmax(120px,1fr))', gap: 12 }}>
              <Mini label="Dias corridos" value={m.diasCorridos} />
              <Mini label="Alíquota IR atual" value={inv.isentoIR ? 'Isento' : fmtPct(m.aliqIR)} />
              <Mini label="IOF (se resgate hoje)" value={m.iofAliq > 0 ? fmtPct(m.iofAliq) : '—'} />
              <Mini label="Ganho bruto até hoje" value={fmtBRL(m.ganhoBruto)} accent={m.ganhoBruto >= 0 ? C.lime : C.red} />
              <Mini label="Ganho estimado no venc." value={fmtBRL(m.ganhoEstVenc)} accent={m.ganhoEstVenc >= 0 ? C.lime : C.red} />
              <Mini label="Rent. bruta total" value={fmtPct(m.rentBrutaTotal)} />
            </div>
            {inv.observacoes && <div><SectionLabel>Observações</SectionLabel><p style={{ fontSize: 13 }}>{inv.observacoes}</p></div>}
            <div>
              <SectionLabel>Evolução mensal (valor bruto)</SectionLabel>
              <MiniLineChart data={buildMonthlySeriesForInv(inv, refTaxas, todayStr())} valueKey="bruto" labelKey="label" height={140} color={C.lime} />
              <div style={{ color: C.muted, fontSize: 10.5, marginTop: 2 }}>fim de cada mês — projetado pela taxa efetiva atual entre os lançamentos reais que você fez</div>
            </div>
            <div>
              <SectionLabel icon={<Icon name="history" size={12} />}>Histórico de valores</SectionLabel>
              <div className="scrollbar-thin" style={{ display: 'flex', flexDirection: 'column', gap: 4, marginBottom: 12, maxHeight: 140, overflowY: 'auto' }}>{hist.map(h => <div key={h.id} style={{ display: 'flex', justifyContent: 'space-between', fontSize: 12, color: C.muted, padding: '3px 0' }}><span>{fmtData(h.data)}</span><span style={{ fontFamily: "'IBM Plex Mono', monospace", color: C.text }}>{fmtBRL(h.valorBruto)}</span></div>)}</div>
              {inv.status === 'ativo' && <div style={{ display: 'flex', gap: 8, alignItems: 'flex-end', flexWrap: 'wrap' }}>
                <div><span style={{ color: C.muted, fontSize: 11 }}>Data</span><input type="date" style={{ ...inputStyle, width: 150 }} value={historicoDraft.data} onChange={e => setHistoricoDraft(d => ({ ...d, data: e.target.value }))} /></div>
                <div><span style={{ color: C.muted, fontSize: 11 }}>Valor bruto atual</span><input type="number" placeholder="0,00" style={{ ...inputStyle, width: 140 }} value={historicoDraft.valor} onChange={e => setHistoricoDraft(d => ({ ...d, valor: e.target.value }))} /></div>
                <button onClick={() => addHistorico(inv.id)} style={{ background: C.lime, color: '#10160A', border: 'none', borderRadius: 8, padding: '9px 14px', fontWeight: 700, fontSize: 12.5, cursor: 'pointer' }}>Registrar</button>
              </div>}
            </div>
            {inv.status === 'ativo' ? (resgatandoId === inv.id ? (
              <div><SectionLabel>Registrar resgate</SectionLabel><div style={{ display: 'flex', gap: 8, alignItems: 'flex-end', flexWrap: 'wrap' }}>
                <div><span style={{ color: C.muted, fontSize: 11 }}>Data do resgate</span><input type="date" style={{ ...inputStyle, width: 150 }} value={resgateDraft.data} onChange={e => setResgateDraft(d => ({ ...d, data: e.target.value }))} /></div>
                <div><span style={{ color: C.muted, fontSize: 11 }}>Valor líquido recebido</span><input type="number" placeholder="0,00" style={{ ...inputStyle, width: 150 }} value={resgateDraft.valor} onChange={e => setResgateDraft(d => ({ ...d, valor: e.target.value }))} /></div>
                <button onClick={() => confirmResgate(inv.id)} style={{ background: C.lime, color: '#10160A', border: 'none', borderRadius: 8, padding: '9px 14px', fontWeight: 700, fontSize: 12.5, cursor: 'pointer' }}>Confirmar</button>
                <button onClick={() => setResgatandoId(null)} style={{ background: 'none', color: C.muted, border: `1px solid ${C.hairline}`, borderRadius: 8, padding: '9px 14px', fontSize: 12.5, cursor: 'pointer' }}>Cancelar</button>
              </div></div>
            ) : <button onClick={() => { setResgatandoId(inv.id); setResgateDraft({ data: todayStr(), valor: Math.round(m.valorAtualLiquido * 100) / 100 }); }} style={{ alignSelf: 'flex-start', background: C.panel2, color: C.lime, border: 'none', borderRadius: 8, padding: '8px 14px', fontSize: 12.5, fontWeight: 700, cursor: 'pointer', display: 'flex', gap: 6, alignItems: 'center' }}><Icon name="check" size={14} /> Registrar resgate</button>
            ) : <div style={{ display: 'flex', alignItems: 'center', gap: 12 }}><span style={{ fontSize: 13, color: C.muted }}>Recebido líquido: <b style={{ color: C.text }}>{fmtBRL(inv.valorLiquidoRecebido)}</b></span><button onClick={() => reabrir(inv.id)} style={{ background: 'none', color: C.muted, border: `1px solid ${C.hairline}`, borderRadius: 8, padding: '6px 12px', fontSize: 12, cursor: 'pointer' }}>Reabrir</button></div>}
          </div>}
        </div>;
      })}</div>
    )}
  </div>;
}

function FormModal({ form, setForm, editingId, formError, refTaxas, onClose, onSave, onTipoChange }) {
  const set = (k) => (e) => setForm(f => ({ ...f, [k]: e.target.value }));
  const efetiva = taxaAnualEfetiva({ ...form, parametroValor: form.parametroValor }, refTaxas);
  return <div style={{ position: 'fixed', inset: 0, background: '#000000C0', display: 'flex', alignItems: 'flex-start', justifyContent: 'center', padding: '24px 16px', overflowY: 'auto', zIndex: 50 }}>
    <div style={{ background: C.panel, borderRadius: 18, width: '100%', maxWidth: 620, padding: 24, boxShadow: shadow, borderTop: `1px solid ${C.hairline}` }}>
      <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between', marginBottom: 20 }}>
        <h2 style={{ fontSize: 17, fontWeight: 700, margin: 0 }}>{editingId ? 'Editar aplicação' : 'Nova aplicação'}</h2>
        <button onClick={onClose} style={{ background: 'none', border: 'none', color: C.muted, cursor: 'pointer' }}><Icon name="x" size={19} /></button>
      </div>
      <div style={{ display: 'grid', gridTemplateColumns: 'repeat(auto-fit,minmax(220px,1fr))', gap: 16 }}>
        <Field label="Instituição / emissor"><input style={inputStyle} placeholder="Ex: Banco XP, Rico, Itaú…" value={form.instituicao} onChange={set('instituicao')} /></Field>
        <Field label="Tipo"><select style={inputStyle} value={form.tipo} onChange={e => onTipoChange(e.target.value)}>{TIPOS.map(t => <option key={t} value={t}>{t}</option>)}</select></Field>
        <Field label="Indexador"><select style={inputStyle} value={form.indexador} onChange={set('indexador')}>{INDEXADORES.map(t => <option key={t} value={t}>{t}</option>)}</select></Field>
        <Field label={parametroLabel(form.indexador)} hint={`taxa efetiva calculada: ${fmtPct(efetiva)} a.a.`}><input type="number" style={inputStyle} placeholder="Ex: 110" value={form.parametroValor} onChange={set('parametroValor')} /></Field>
        <Field label="Data de aplicação"><input type="date" style={inputStyle} value={form.dataAplicacao} onChange={set('dataAplicacao')} /></Field>
        <Field label="Data de vencimento"><input type="date" style={inputStyle} value={form.dataVencimento} onChange={set('dataVencimento')} /></Field>
        <Field label="Valor aplicado (bruto)"><input type="number" style={inputStyle} placeholder="0,00" value={form.valorAplicado} onChange={set('valorAplicado')} /></Field>
        <Field label="Liquidez"><select style={inputStyle} value={form.liquidez} onChange={set('liquidez')}>{LIQUIDEZ_OPTS.map(t => <option key={t} value={t}>{t}</option>)}</select></Field>
        <Field label="Alíquota de IR manual (%)" hint="deixe vazio para usar a tabela regressiva automática"><input type="number" style={inputStyle} placeholder="automático" value={form.aliquotaIRManual} onChange={set('aliquotaIRManual')} /></Field>
        <Field label="Override da taxa projetada (% a.a.)" hint="opcional"><input type="number" style={inputStyle} placeholder="deixe vazio" value={form.taxaOverrideAnual} onChange={set('taxaOverrideAnual')} /></Field>
        <Field label="Carteira / objetivo" hint="opcional"><input style={inputStyle} placeholder="Ex: Reserva de emergência" value={form.carteira} onChange={set('carteira')} /></Field>
        <label style={{ display: 'flex', alignItems: 'center', gap: 8, gridColumn: '1 / -1', marginTop: 4 }}><input type="checkbox" checked={form.isentoIR} onChange={e => setForm(f => ({ ...f, isentoIR: e.target.checked }))} /><span style={{ fontSize: 13 }}>Isento de Imposto de Renda (padrão para LCI/LCA/CRI/CRA)</span></label>
        <div style={{ gridColumn: '1 / -1' }}><Field label="Observações"><textarea style={{ ...inputStyle, minHeight: 68, resize: 'vertical' }} placeholder="Notas livres…" value={form.observacoes} onChange={set('observacoes')} /></Field></div>
      </div>
      {formError && <p style={{ color: C.red, fontSize: 13, marginTop: 12 }}>{formError}</p>}
      <div style={{ display: 'flex', justifyContent: 'flex-end', gap: 12, marginTop: 24 }}>
        <button onClick={onClose} style={{ background: 'none', border: `1px solid ${C.hairline}`, color: C.muted, borderRadius: 10, padding: '10px 16px', cursor: 'pointer', fontSize: 13.5 }}>Cancelar</button>
        <button onClick={onSave} style={{ background: C.lime, border: 'none', color: '#10160A', borderRadius: 10, padding: '10px 18px', cursor: 'pointer', fontWeight: 700, fontSize: 13.5 }}>{editingId ? 'Salvar alterações' : 'Adicionar aplicação'}</button>
      </div>
    </div>
  </div>;
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
